<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batuhan Team — Customer List</title>
<style>
  body { margin: 0; padding: 24px 12px; background: #0e0f11; display: flex; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
  select, input { font-family: inherit; }
</style>
</head>
<body>

<div style="max-width: 560px; width: 100%; color: #e8e8ea;">

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">
    <div style="width:34px;height:34px;border-radius:8px;background:#2a2b2f;display:flex;align-items:center;justify-content:center;font-size:16px;">📋</div>
    <div style="flex:1;">
      <div style="font-size:15px; font-weight:600;">Batuhan Team — Customer List</div>
      <div style="font-size:12px; color:#8a8b90;">Upload BookNow screenshots, review, copy everything</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:11px; color:#9a9ba0;">Logged in as</div>
      <div style="font-size:12px; color:#e8e8ea; font-weight:600;" id="loggedInAs">—</div>
      <button id="changeAgentBtn" type="button" style="background:none; border:none; color:#3a6df0; font-size:10px; cursor:pointer; padding:0; text-decoration:underline;">change</button>
    </div>
  </div>

  <div id="reviewBanner" style="display:none; background:#3a2a1a; border:1px solid #6b4a1f; border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:12px; color:#ffb84d;"></div>

  <div id="dropzone" style="border:1.5px dashed #3a3b40; border-radius:10px; padding:16px; text-align:center; margin-bottom:16px; cursor:pointer;">
    <div id="dz-idle">
      <div style="font-size:22px; margin-bottom:4px;">🖼️</div>
      <div style="font-size:13px; color:#c4c5ca;">Paste or select multiple BookNow screenshots</div>
      <div style="font-size:11px; color:#6c6d72; margin-top:2px;">Ctrl+V to paste several images, or click to select multiple files</div>
    </div>
    <div id="dz-busy" style="display:none; font-size:13px; color:#8ab4ff;"></div>
    <input type="file" id="fileinput" accept="image/*" multiple style="display:none;">
  </div>

  <div style="margin-bottom:12px;">
    <button id="deleteAllBtn" type="button" style="width:100%; background:#2a1a1a; color:#ff8080; border:1px solid #4a2a2a; border-radius:8px; padding:9px; font-size:12.5px; cursor:pointer;">🗑 Delete All Records</button>
  </div>

  <div id="cards"></div>

  <div id="bulkbar" style="display:none; position:sticky; bottom:12px; margin-top:16px;">
    <button id="copyall" type="button" style="width:100%; background:#3a6df0; color:#fff; border:none; border-radius:9px; padding:12px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 14px rgba(0,0,0,.4);">
      📋 <span id="copyalllabel">Copy selected (0)</span>
    </button>
  </div>

  <textarea id="hiddenarea" style="position:absolute; left:-9999px;"></textarea>
</div>

<script>
(function() {
  var TAB = String.fromCharCode(9);
  var NL = String.fromCharCode(10);
  var WORKER_URL = 'https://cleopatra-lp-proxy.rinelement.workers.dev/';

  var AGENTS = ['Su Yeniocak','Ezgi Keskin','Onur Dokcan','Ceyhun Işık','Ege Dokcan','Shiv Karan Murmu'];
  var STUDIOS = ['Baltimore','Pittsburgh','Sarasota','Buffalo','Fayetteville','Fort Drum','Panama City','New Orleans','Durham NY'];
  var CHANNELS = ['Facebook','Mail','TikTok','Website','Landing Page'];
  var TYPES = ['Tattoo','Piercing','Microblading'];
  var VONAGE_AGENTS = ['Ege Dokcan','Shiv Karan Murmu'];

  var STUDIO_COLORS = ['#e07a5f','#81b29a','#f2cc8f','#3d5a80','#ee6c4d','#98c1d9','#c9ada7','#e8998d','#6b9080'];
  function studioColor(studio) {
    var h = 0;
    for (var i = 0; i < studio.length; i++) h = (h * 31 + studio.charCodeAt(i)) >>> 0;
    return STUDIO_COLORS[h % STUDIO_COLORS.length];
  }

  var CHANNEL_RAW_MAP = {
    'Landing Page Design':'Landing Page','Facebook Design':'Facebook','E-Mail Design':'Mail',
    'TikTok Design':'TikTok','Website Design':'Website'
  };

  function todayDot() {
    var d = new Date();
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  }

  function cleanPhone(v) {
    var digits = (v || '').replace(/\D/g, '');
    if (digits.length === 11 && digits[0] === '1') digits = digits.slice(1);
    return digits.length ? digits : 'N/A';
  }

  function cleanText(v) {
    return (v || '').replace(/[\u00A0\u200B\u200C\u200D\uFEFF]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function normalizeDot(v) {
    if (!v) return '';
    var s = String(v).replace(/[\u00A0\u200B\u200C\u200D\uFEFF]/g, '').trim();
    if (!s) return '';
    var m = s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
    if (m) return parseInt(m[1],10) + '/' + parseInt(m[2],10) + '/' + m[3];
    var m2 = s.match(/^(\d{4})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})$/);
    if (m2) return parseInt(m2[2],10) + '/' + parseInt(m2[3],10) + '/' + m2[1];
    return s;
  }

  function findClosest(list, value) {
    if (!value) return null;
    var lower = value.trim().toLowerCase();
    for (var i = 0; i < list.length; i++) { if (list[i].toLowerCase() === lower) return list[i]; }
    for (var j = 0; j < list.length; j++) {
      var lj = list[j].toLowerCase();
      if (lj.indexOf(lower) !== -1 || lower.indexOf(lj) !== -1) return list[j];
    }
    return null;
  }

  function teamForAgent(agent) {
    return VONAGE_AGENTS.indexOf(agent) !== -1 ? 'VONAGE' : 'CHAT';
  }

  function opts(list, selected) {
    return list.map(function(v) {
      return '<option value="' + v.replace(/"/g,'&quot;') + '"' + (v === selected ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  }

  function fieldStyle() {
    return 'width:100%; background:#1e1f23; color:#e8e8ea; border:1px solid #34353a; border-radius:8px; padding:7px 8px; font-size:12.5px; box-sizing:border-box;';
  }

  function fileToBase64(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function fallbackCopy(text, hidden) {
    hidden.value = text; hidden.focus(); hidden.select();
    try { document.execCommand('copy'); return true; } catch (e) { return false; }
  }

  function copyText(text, hidden, labelEl, doneText, idleText) {
    if (!text) return;
    function done() { labelEl.textContent = doneText; setTimeout(function() { labelEl.textContent = idleText; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function() { if (fallbackCopy(text, hidden)) done(); });
    } else if (fallbackCopy(text, hidden)) { done(); }
  }

  function fetchWithRetry(url, options, maxRetries) {
    maxRetries = maxRetries || 4;
    var attempt = 0;
    function tryFetch() {
      return fetch(url, options).then(function(response) {
        if (response.status === 429 && attempt < maxRetries) {
          attempt++;
          var delay = Math.min(2000 * Math.pow(2, attempt - 1), 15000);
          return new Promise(function(resolve) { setTimeout(function() { resolve(tryFetch()); }, delay); });
        }
        return response;
      });
    }
    return tryFetch();
  }

  var cardsWrap = document.getElementById('cards');
  var dropzone = document.getElementById('dropzone');
  var fileinput = document.getElementById('fileinput');
  var dzIdle = document.getElementById('dz-idle');
  var dzBusy = document.getElementById('dz-busy');
  var bulkbar = document.getElementById('bulkbar');
  var copyallBtn = document.getElementById('copyall');
  var copyallLabel = document.getElementById('copyalllabel');
  var hidden = document.getElementById('hiddenarea');
  var reviewBanner = document.getElementById('reviewBanner');

  var cards = [];
  var cardSeq = 0;

  var currentAgent = (function() {
    var saved = localStorage.getItem('batuhan_agent_name');
    if (saved && AGENTS.indexOf(saved) !== -1) return saved;
    var typed = prompt('What is your name? (used to pre-select your name in the Agent field)');
    var matched = typed ? findClosest(AGENTS, typed) : null;
    var result = matched || AGENTS[0];
    localStorage.setItem('batuhan_agent_name', result);
    return result;
  })();

  document.getElementById('loggedInAs').textContent = currentAgent;
  document.getElementById('changeAgentBtn').addEventListener('click', function() {
    var typed = prompt('What is your name?');
    if (!typed) return;
    var matched = findClosest(AGENTS, typed) || AGENTS[0];
    currentAgent = matched;
    localStorage.setItem('batuhan_agent_name', matched);
    document.getElementById('loggedInAs').textContent = currentAgent;
  });

  function newCard() {
    cardSeq++;
    var defaultAgent = currentAgent;
    var card = {
      id: 'c' + cardSeq, num: cards.length + 1, status: 'loading', included: true,
      channelUnconfirmed: false, duplicateOf: null,
      data: {
        createdDate: todayDot(), reservationDate: '', agent: defaultAgent, studio: STUDIOS[0],
        channel: CHANNELS[0], fullName: '', phone: '', email: '',
        apptType: 'Tattoo', team: teamForAgent(defaultAgent), notes: ''
      }
    };
    cards.push(card);
    return card;
  }

  function buildRow(d) {
    return [
      normalizeDot(d.createdDate), normalizeDot(d.reservationDate), cleanText(d.agent), cleanText(d.studio),
      cleanText(d.channel), cleanText(d.fullName), cleanPhone(d.phone), cleanText(d.email) || 'N/A',
      cleanText(d.apptType), cleanText(d.team), cleanText(d.notes)
    ].join(TAB);
  }

  function checkDuplicate(card) {
    var phone = cleanPhone(card.data.phone);
    var email = cleanText(card.data.email).toLowerCase();
    for (var i = 0; i < cards.length; i++) {
      var other = cards[i];
      if (other.id === card.id) continue;
      var oPhone = cleanPhone(other.data.phone);
      var oEmail = cleanText(other.data.email).toLowerCase();
      if ((phone !== 'N/A' && phone === oPhone) || (email && email === oEmail)) return other.num;
    }
    return null;
  }

  function renderCard(card) {
    var d = card.data;
    var el = document.createElement('div');
    el.style.cssText = 'background:#16171a; border:1px solid ' + (card.included ? '#2a2b2f' : '#3a2a1a') + '; border-left:3px solid ' + studioColor(d.studio) + '; border-radius:12px; padding:14px; margin-bottom:10px; opacity:' + (card.included ? '1' : '0.5') + ';';
    el.id = 'card-' + card.id;

    var statusHtml = card.status === 'loading' ? '<span style="font-size:11px; color:#8ab4ff;">Reading...</span>'
      : card.status === 'error' ? '<span style="font-size:11px; color:#ff8080;">Could not read, fill manually</span>'
      : '<span style="font-size:11px; color:#7ee787;">Review</span>';

    var dupHtml = card.duplicateOf ? '<div style="font-size:11px; color:#ffb84d; margin-bottom:8px;">⚠️ Possible duplicate of Record #' + card.duplicateOf + '</div>' : '';

    el.innerHTML =
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">' +
        '<label style="display:flex; align-items:center; gap:6px; font-size:12px; color:#9a9ba0; cursor:pointer;"><input type="checkbox" class="f-include" data-id="'+card.id+'" '+(card.included?'checked':'')+' style="cursor:pointer;"> Record #' + card.num + '</label>' +
        '<div style="display:flex; align-items:center; gap:10px;">' + statusHtml +
          '<button class="removebtn" data-id="' + card.id + '" type="button" style="background:none; border:none; color:#6c6d72; cursor:pointer; font-size:16px; line-height:1; padding:0;">×</button>' +
        '</div>' +
      '</div>' +
      dupHtml +

      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Created Date</label><input class="f-createdDate" data-id="'+card.id+'" type="text" value="'+d.createdDate+'" style="'+fieldStyle()+'"></div>' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Reservation Date</label><input class="f-reservationDate" data-id="'+card.id+'" type="text" value="'+d.reservationDate+'" placeholder="M/D/YYYY" style="'+fieldStyle()+'"></div>' +
      '</div>' +

      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Agent</label><select class="f-agent" data-id="'+card.id+'" style="'+fieldStyle()+'">'+opts(AGENTS, d.agent)+'</select></div>' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Studio</label><select class="f-studio" data-id="'+card.id+'" style="'+fieldStyle()+'">'+opts(STUDIOS, d.studio)+'</select></div>' +
      '</div>' +

      '<div style="margin-bottom:8px;"><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Full Name</label><input class="f-fullName" data-id="'+card.id+'" type="text" value="'+(d.fullName||'').replace(/"/g,'&quot;')+'" style="'+fieldStyle()+'"></div>' +

      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Phone Number</label><input class="f-phone" data-id="'+card.id+'" type="text" value="'+(d.phone||'')+'" style="'+fieldStyle()+'"></div>' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Email</label><input class="f-email" data-id="'+card.id+'" type="text" value="'+(d.email||'')+'" style="'+fieldStyle()+'"></div>' +
      '</div>' +

      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">' +
        '<div><label style="font-size:10px;color:'+(card.channelUnconfirmed?'#ff8080':'#9a9ba0')+';display:block;margin-bottom:3px;">Channel'+(card.channelUnconfirmed?' ⚠️ Check':'')+'</label><select class="f-channel" data-id="'+card.id+'" style="'+fieldStyle()+(card.channelUnconfirmed?' border-color:#ff8080;':'')+'">'+opts(CHANNELS, d.channel)+'</select></div>' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Appointment Type</label><select class="f-apptType" data-id="'+card.id+'" style="'+fieldStyle()+'">'+opts(TYPES, d.apptType)+'</select></div>' +
      '</div>' +

      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Team (auto)</label><input type="text" value="'+d.team+'" disabled style="'+fieldStyle()+' opacity:0.7; cursor:not-allowed;"></div>' +
        '<div><label style="font-size:10px;color:#9a9ba0;display:block;margin-bottom:3px;">Notes</label><input class="f-notes" data-id="'+card.id+'" type="text" value="'+(d.notes||'').replace(/"/g,'&quot;')+'" style="'+fieldStyle()+'"></div>' +
      '</div>' +

      '<div class="rowpreview" style="font-size:10.5px; color:#6c6d72; background:#1a1b1e; border-radius:6px; padding:6px 8px; word-break:break-all; line-height:1.5;"></div>';

    return el;
  }

  function refreshAll() {
    cardsWrap.innerHTML = '';
    cards.forEach(function(card, i) { card.num = i + 1; });
    cards.forEach(function(card) { card.duplicateOf = checkDuplicate(card); });
    cards.forEach(function(card) { cardsWrap.appendChild(renderCard(card)); });
    bindCardEvents();
    updatePreviews();
    var includedCount = cards.filter(function(c) { return c.included; }).length;
    bulkbar.style.display = cards.length ? 'block' : 'none';
    copyallLabel.textContent = 'Copy selected (' + includedCount + ')';

    var needsReview = cards.filter(function(c) { return c.status === 'error' || c.channelUnconfirmed; }).length;
    if (needsReview > 0) {
      reviewBanner.style.display = 'block';
      reviewBanner.textContent = '⚠️ ' + needsReview + ' record(s) need manual review';
    } else {
      reviewBanner.style.display = 'none';
    }
  }

  function updatePreviews() {
    cards.forEach(function(card) {
      var el = document.getElementById('card-' + card.id);
      if (!el) return;
      el.querySelector('.rowpreview').textContent = buildRow(card.data).split(TAB).join(' | ');
    });
  }

  function bindCardEvents() {
    var map = [
      ['.f-createdDate','createdDate'], ['.f-reservationDate','reservationDate'], ['.f-studio','studio'],
      ['.f-fullName','fullName'], ['.f-phone','phone'], ['.f-email','email'],
      ['.f-apptType','apptType'], ['.f-notes','notes']
    ];
    map.forEach(function(pair) {
      document.querySelectorAll(pair[0]).forEach(function(node) {
        node.addEventListener('input', function() {
          var id = this.dataset.id;
          var card = cards.filter(function(c) { return c.id === id; })[0];
          if (card) { card.data[pair[1]] = this.value; updatePreviews(); }
        });
        node.addEventListener('change', function() {
          var id = this.dataset.id;
          var card = cards.filter(function(c) { return c.id === id; })[0];
          if (card) { card.data[pair[1]] = this.value; updatePreviews(); refreshAll(); }
        });
      });
    });

    document.querySelectorAll('.f-agent').forEach(function(node) {
      node.addEventListener('change', function() {
        var id = this.dataset.id;
        var card = cards.filter(function(c) { return c.id === id; })[0];
        if (card) { card.data.agent = this.value; card.data.team = teamForAgent(this.value); refreshAll(); }
      });
    });

    document.querySelectorAll('.f-channel').forEach(function(node) {
      node.addEventListener('change', function() {
        var id = this.dataset.id;
        var card = cards.filter(function(c) { return c.id === id; })[0];
        if (card) { card.data.channel = this.value; card.channelUnconfirmed = false; refreshAll(); }
      });
    });

    document.querySelectorAll('.f-include').forEach(function(node) {
      node.addEventListener('change', function() {
        var id = this.dataset.id;
        var card = cards.filter(function(c) { return c.id === id; })[0];
        if (card) { card.included = this.checked; refreshAll(); }
      });
    });

    document.querySelectorAll('.removebtn').forEach(function(node) {
      node.addEventListener('click', function() {
        var id = this.dataset.id;
        cards = cards.filter(function(c) { return c.id !== id; });
        refreshAll();
      });
    });
  }

  function processFile(file) {
    return fileToBase64(file).then(function(base64) {
      var mediaType = file.type || 'image/png';
      var promptText = 'BookNow appointment request screenshot for a tattoo/piercing/microblading studio. Valid studios (write EXACTLY from this list, no prefix): ' + STUDIOS.join(', ') + '. Valid raw channel/booking-source values you might see: Landing Page Design, Facebook Design, E-Mail Design, TikTok Design, Website Design. This can be a SINGLE appointment detail page (Full Name/Email/Phone/Location/Local Time fields) or a MULTI-row pending table (Name/Contact/Location/Date/Status). Extract EVERY record on screen: full name, phone, email, studio, reservation date in MM.DD.YYYY format (use USER LOCAL TIME, not Branch Time), raw channel value if visible, appointment type (Tattoo, Piercing, or Microblading, based on the service name).\n\nReturn ONLY a JSON ARRAY, no other text:\n[{"fullName":"","phone":"","email":"","studio":"","reservationDate":"","channel":"","apptType":""}]\n\nLeave empty string if unknown, never guess. Return array even for a single record.';

      return fetchWithRetry(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64, mediaType: mediaType, prompt: promptText })
      });
    }).then(function(response) {
      if (!response.ok) throw new Error('API error: ' + response.status);
      return response.json();
    }).then(function(data) {
      var textBlock = '';
      try {
        textBlock = data.candidates[0].content.parts.map(function(p) { return p.text || ''; }).join('');
      } catch (e) {
        throw new Error('Unexpected response format: ' + JSON.stringify(data).slice(0, 200));
      }
      var cleaned = textBlock.replace(/```json|```/g, '').trim();
      var extractedList = JSON.parse(cleaned);
      if (!Array.isArray(extractedList)) extractedList = [extractedList];

      extractedList.forEach(function(extracted) {
        var card = newCard();
        if (extracted.fullName) card.data.fullName = extracted.fullName;
        if (extracted.phone) card.data.phone = cleanPhone(extracted.phone);
        if (extracted.email) card.data.email = extracted.email;
        if (extracted.reservationDate) card.data.reservationDate = normalizeDot(extracted.reservationDate);
        if (extracted.studio) {
          var matched = findClosest(STUDIOS, extracted.studio);
          if (matched) card.data.studio = matched;
        }
        if (extracted.channel) {
          var mappedCh = CHANNEL_RAW_MAP[extracted.channel] || extracted.channel;
          var matchedCh = findClosest(CHANNELS, mappedCh);
          if (matchedCh) { card.data.channel = matchedCh; card.channelUnconfirmed = false; }
          else { card.channelUnconfirmed = true; }
        } else {
          card.channelUnconfirmed = true;
        }
        if (extracted.apptType) {
          var matchedType = findClosest(TYPES, extracted.apptType);
          if (matchedType) card.data.apptType = matchedType;
        }
        card.status = 'done';
      });
      refreshAll();
    }).catch(function(err) {
      var card = newCard();
      card.status = 'error';
      console.error(err);
      refreshAll();
    });
  }

  function processFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function(f) { return f.type.indexOf('image') === 0; });
    var chain = Promise.resolve();
    files.forEach(function(f, idx) {
      chain = chain.then(function() {
        dzIdle.style.display = 'none';
        dzBusy.style.display = 'block';
        dzBusy.textContent = 'Processing... (' + (idx + 1) + '/' + files.length + ')';
        return processFile(f);
      });
    });
    chain = chain.then(function() { dzBusy.style.display = 'none'; dzIdle.style.display = 'block'; });
    return chain;
  }

  dropzone.addEventListener('click', function() { fileinput.click(); });
  fileinput.addEventListener('change', function(e) {
    if (e.target.files && e.target.files.length) processFiles(e.target.files);
    fileinput.value = '';
  });
  document.addEventListener('paste', function(e) {
    var items = (e.clipboardData || {}).items || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) { var f = items[i].getAsFile(); if (f) files.push(f); }
    }
    if (files.length) processFiles(files);
  });
  dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.style.borderColor = '#3a6df0'; });
  dropzone.addEventListener('dragleave', function() { dropzone.style.borderColor = '#3a3b40'; });
  dropzone.addEventListener('drop', function(e) {
    e.preventDefault(); dropzone.style.borderColor = '#3a3b40';
    if (e.dataTransfer.files && e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
  });

  document.getElementById('deleteAllBtn').addEventListener('click', function() {
    if (cards.length && !confirm('Delete all ' + cards.length + ' record(s)?')) return;
    cards = [];
    refreshAll();
  });

  copyallBtn.addEventListener('click', function() {
    var rows = cards.filter(function(c) { return c.included; }).map(function(c) { return buildRow(c.data); }).join(NL);
    copyText(rows, hidden, copyallLabel, 'Copied ✓', 'Copy selected (' + cards.filter(function(c){return c.included;}).length + ')');
  });

  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') copyallBtn.click();
  });
})();
</script>
</body>
</html>
